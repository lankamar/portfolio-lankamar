    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var q = new URLSearchParams(location.search).get("theme");
          if (q === "dark" || q === "light") {
            t = q;
            localStorage.setItem("theme", q);
          }
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
