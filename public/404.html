<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada — Marcelo Lancry Kamycki</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 22px;
        background: #ffffff;
        color: #000000;
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
      }
      .contenido {
        width: 100%;
        max-width: 440px;
      }
      .marca {
        margin: 0 0 16px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #ca3737;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(26px, 7vw, 34px);
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.01em;
        overflow-wrap: break-word;
      }
      .texto {
        margin: 0 0 6px;
        color: #3c3c3c;
      }
      .codigo {
        margin: 0 0 30px;
        font-size: 14px;
        color: #6f6f6f;
      }
      .boton {
        display: inline-block;
        padding: 11px 20px;
        border-radius: 6px;
        background: #ca3737;
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
      }
      .boton:hover,
      .boton:focus {
        background: #b12f2f;
      }
      .boton:focus-visible {
        outline: 3px solid #000000;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="contenido">
      <p class="marca">Lankamar</p>
      <h1>Página no encontrada</h1>
      <p class="texto">La dirección que abriste no existe o cambió de lugar.</p>
      <p class="codigo">Error 404</p>
      <a class="boton" href="/">Volver al inicio</a>
    </main>
  </body>
</html>
